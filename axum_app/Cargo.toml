[package]
name = "axum_app"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7.4", features = [ "runtime-tokio-rustls", "postgres" ] } # Reverted to 0.7.4
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0" # Added anyhow

[dev-dependencies]
testcontainers = "0.21" # Updated from 0.19
testcontainers-modules = { version = "0.9", features = ["postgres"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] } # Added tokio for dev
